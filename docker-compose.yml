# MRepo Docker Compose
#
# Quick start:
#   1. Edit this file to set your music path (replace /path/to/Music)
#   2. Run: docker compose up -d
#   3. Open http://localhost:8080
#
# With AI features (CPU):
#   docker compose --profile ai up -d
#
# With AI features (GPU):
#   docker compose --profile ai-gpu up -d
#
# AI auto-enables when the AI service is reachable. To disable AI,
# simply don't start the AI profile - no environment variable needed.
#
# Port exposure: only mrepo publishes a port. The AI service is reachable
# from mrepo over the compose network and is deliberately NOT published to
# the host - it has no authentication of any kind (see the note on the
# mrepo-ai service below).

services:
  mrepo:
    image: ghcr.io/iwalton3/mrepo-web:main
    ports:
      # This is the only service meant to be reachable from outside Docker.
      # Behind a reverse proxy, narrow it to "127.0.0.1:8080:8080" so the app
      # itself is only reachable through the proxy.
      - "8080:8080"
    volumes:
      # Database (persistent)
      - mrepo-data:/data
      # Music files (read-only, adjust path to your music library)
      - /path/to/Music:/media:ro
    environment:
      - DATABASE_PATH=/data/music.db
      - MEDIA_PATH=/media
      # AI service URL - AI auto-enables when this URL is reachable
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://mrepo-ai:5002}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/config.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Service (CPU) - Enable with: docker compose --profile ai up
  #
  # No published ports, by design. This service has NO authentication: anyone
  # who can reach port 5002 can read your library's embeddings, run searches,
  # and wipe the whole index via POST /clear. It also has read access to your
  # music files and the database. mrepo reaches it as http://mrepo-ai:5002 over
  # the compose network, which does not require publishing anything to the host.
  #
  # Do not add a "ports:" mapping here. Docker publishes to 0.0.0.0 by default,
  # which puts the service on your LAN - and on a VPS, on the public internet.
  # Docker also inserts its own iptables rules ahead of ufw/firewalld, so a host
  # firewall will not reliably block a published port.
  #
  # For debugging, publish it to loopback only and remove it afterwards:
  #   ports: ["127.0.0.1:5002:5002"]
  mrepo-ai:
    image: ghcr.io/iwalton3/mrepo-web-ai:main
    profiles:
      - ai
    expose:
      - "5002"
    volumes:
      # Music files (same as main service, read-only)
      - /path/to/Music:/media:ro
      # Database and embeddings storage (shared with main container)
      - mrepo-data:/data
      # Model cache (persistent, prevents re-downloading)
      - ai-models:/root/.cache
    environment:
      - MEDIA_PATH=/media
      - MUSIC_DB=/data/music.db
      - EMBEDDINGS_PATH=/data/ai
      - AI_DEVICE=cpu
      - AI_BATCH_SIZE=4
    networks:
      default:
        aliases:
          - mrepo-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Service (GPU/CUDA) - Enable with: docker compose --profile ai-gpu up
  # Requires NVIDIA Container Toolkit
  # Unauthenticated - not published to the host. See the note on mrepo-ai above.
  mrepo-ai-gpu:
    image: ghcr.io/iwalton3/mrepo-web-ai-gpu:main
    profiles:
      - ai-gpu
    expose:
      - "5002"
    volumes:
      - /path/to/Music:/media:ro
      - mrepo-data:/data
      - ai-models:/root/.cache
    environment:
      - MEDIA_PATH=/media
      - MUSIC_DB=/data/music.db
      - EMBEDDINGS_PATH=/data/ai
      - AI_DEVICE=cuda
      - AI_BATCH_SIZE=8
    networks:
      default:
        aliases:
          - mrepo-ai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mrepo-data:
  ai-models:
